apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: web-app
        image: stefanprodan/podinfo:6.0.0
        ports:
        - containerPort: 9898
        envFrom:
        - configMapRef:
            name: app-config
